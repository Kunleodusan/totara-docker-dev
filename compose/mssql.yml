services:

  mssql2017:
    build:
      context: ../mssql
      dockerfile: "2017/Dockerfile"
    image: "setup-mssql:2017"
    # Mssql does not support multiple architectures
    platform: linux/amd64
    container_name: totara_mssql
    restart: ${RESTART_POLICY:-no}
    ports:
      - "1433:1433"
    environment:
      TZ: ${TIME_ZONE}
      ACCEPT_EULA: Y
      SA_PASSWORD: ${MSSQL_SA_PW}
      MSSQL_PID: Developer
    volumes:
      - mssql-data:/var/opt/mssql
    depends_on:
      - nginx
    networks:
      - totara

  mssql2019:
    build:
      context: ../mssql
      dockerfile: "2019/Dockerfile"
    image: "setup-mssql:2019"
    # Mssql does not support multiple architectures
    platform: linux/amd64
    container_name: totara_mssql2019
    restart: ${RESTART_POLICY:-no}
    ports:
      - "1419:1433"
    environment:
      TZ: ${TIME_ZONE}
      ACCEPT_EULA: Y
      SA_PASSWORD: ${MSSQL_SA_PW}
      MSSQL_PID: Developer
    volumes:
      - mssql2019-data:/var/opt/mssql
    depends_on:
      - nginx
    networks:
      - totara

  mssql2022:
    build:
      context: ../mssql
      dockerfile: "2022/Dockerfile"
    image: "setup-mssql:2022"
    # Mssql does not support multiple architectures
    platform: linux/amd64
    container_name: totara_mssql2022
    restart: ${RESTART_POLICY:-no}
    ports:
      - "1420:1433"
    environment:
      TZ: ${TIME_ZONE}
      ACCEPT_EULA: Y
      SA_PASSWORD: ${MSSQL_SA_PW}
      MSSQL_PID: Developer
    volumes:
      - mssql2022-data:/var/opt/mssql
    depends_on:
      - nginx
    networks:
      - totara

volumes:
  mssql-data:
  mssql2019-data:
  mssql2022-data:
